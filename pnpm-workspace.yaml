packages:
  - packages/*
  - docs-site

# One version list for the workspace root and every package. The engine's
# manifest names `catalog:` for `@napi-rs/cli`, `playwright` and `vite`; the
# docs site names it for its Fumadocs, Next, React and Tailwind versions.
catalog:
  '@arethetypeswrong/cli': 0.18.5
  '@eslint/js': 10.0.1
  '@nx/js': 23.2.1
  '@napi-rs/cli': 3.10.8
  '@size-limit/file': 14.1.0
  '@tailwindcss/postcss': 4.3.3
  '@types/mdx': 2.0.14
  '@types/node': 26.6.4
  '@types/react': 19.3.0
  '@types/react-dom': 19.3.0
  '@vitest/coverage-v8': 5.0.3
  eslint: 10.12.0
  eslint-plugin-import-x: 4.17.1
  fumadocs-core: 16.16.2
  fumadocs-mdx: 15.4.6
  fumadocs-typescript: 5.4.1
  fumadocs-ui: 16.16.2
  # The docs site's live demo runs the published engine's WASM build, which only
  # the Darwin release recipe can produce, so it pins a `next` prerelease from the
  # registry under an alias instead of the workspace package.
  geospec-engine-next: npm:geospec-engine@0.1.0-next.19
  globals: 17.13.0
  knip: 6.39.0
  next: 16.3.8
  nx: 23.2.1
  oxfmt: 0.72.0
  oxlint: 1.87.0
  oxlint-tsgolint: 7.0.2003
  playwright: 1.63.0
  publint: 0.3.25
  react: 19.3.0
  react-dom: 19.3.0
  semver: 7.8.5
  size-limit: 14.1.0
  tailwindcss: 4.3.3
  tsdown: 0.23.0
  tsx: 4.23.15
  typescript: 7.0.2
  typescript-eslint: 8.71.1
  vite: 8.3.3
  vitest: 5.0.3

allowBuilds:
  '@napi-rs/cli': true
  esbuild: true
  nx: true
  unrs-resolver: true

linkWorkspacePackages: true

# Patched floors for advisories in transitive dependencies that their parents
# still pin (nx: axios, brace-expansion, smol-toml; oxfmt: tinypool). Drop an
# entry once the parent ships the patched version.
overrides:
  'axios@>=1.0.0 <1.20.0': 1.20.0
  'brace-expansion@>=4.0.0 <5.0.12': 5.0.12
  # mdast-util-to-markdown 2.2.0 serializes `strong` through a wrapper root,
  # which recurses forever under the Fumadocs 16.10 stringifier the docs site
  # uses for its Markdown projection. Hold the 2.1 line NanoRaster's site runs.
  'mdast-util-to-markdown@>=2.2.0': 2.1.2
  'smol-toml@<1.8.1': 1.9.0
  'tinypool@<2.1.2': 2.1.2

# First-party prereleases the docs site pins as soon as CI publishes them; the
# release-age delay guards third-party packages.
minimumReleaseAgeExclude:
  - geospec-engine-darwin-arm64@0.1.0-next.19
  - geospec-engine@0.1.0-next.19
