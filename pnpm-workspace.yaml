packages:
  - packages/*

# One version list for the workspace root and every package. The engine's
# manifest names `catalog:` for `@napi-rs/cli`, `playwright` and `vite`.
catalog:
  '@arethetypeswrong/cli': 0.18.5
  '@eslint/js': 10.0.1
  '@nx/js': 23.2.1
  '@napi-rs/cli': 3.10.7
  '@size-limit/file': 14.1.0
  '@types/node': 26.6.4
  '@vitest/coverage-v8': 5.0.3
  eslint: 10.12.0
  eslint-plugin-import-x: 4.17.1
  globals: 17.13.0
  knip: 6.39.0
  nx: 23.2.1
  oxfmt: 0.72.0
  oxlint: 1.87.0
  oxlint-tsgolint: 7.0.2003
  playwright: 1.63.0
  publint: 0.3.25
  semver: 7.8.5
  size-limit: 14.1.0
  tsdown: 0.23.0
  tsx: 4.23.15
  typescript: 7.0.2
  typescript-eslint: 8.71.1
  vite: 8.3.2
  vitest: 5.0.3

allowBuilds:
  '@napi-rs/cli': true
  esbuild: true
  nx: true
  unrs-resolver: true

linkWorkspacePackages: true

# Patched floors for advisories in transitive dependencies that their parents
# still pin (nx: axios, brace-expansion, smol-toml; oxfmt: tinypool). Drop an
# entry once the parent ships the patched version.
overrides:
  'axios@>=1.0.0 <1.20.0': 1.20.0
  'brace-expansion@>=4.0.0 <5.0.12': 5.0.12
  'smol-toml@<1.8.1': 1.9.0
  'tinypool@<2.1.2': 2.1.2
