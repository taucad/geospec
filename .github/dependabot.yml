version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      # TypeScript 7 drops the JavaScript compiler API that Nx's project graph calls.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
    groups:
      # Fumadocs moves as one set: its minors change the LLMs projection API the docs
      # site builds on, so a Fumadocs update needs its own docs-site port and review.
      fumadocs:
        patterns: ['fumadocs-*']
      # The NAPI CLI writes the Node binding's index.d.ts, which the engine commits under
      # bindings/node/types/generated and the producer compares byte for byte, so a CLI
      # update lands with that file regenerated by the producer.
      napi-cli:
        patterns: ['@napi-rs/cli']
      root:
        patterns: ['*']

  # The engine's Cargo workspaces: each binding and each native adapter. The core crate's
  # Cargo.toml, Cargo.lock and dependency archives are frozen inputs of the F1 verifier
  # source identity (rust/tests/rational_plate_verifier.rs), so the core is not listed and
  # its exact pins, which every other workspace shares, move only with a verifier profile.
  - package-ecosystem: cargo
    directories:
      - /packages/geospec-engine/bindings/*
      - /packages/geospec-engine/native/*
      - /packages/geospec-engine/native/occt/rust
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    ignore:
      # napi-derive 3.6.10 resolves napi-derive-backend 6.1.5, which moved to syn 3 while
      # napi-derive stays on syn 2, so the macro crate does not compile.
      - dependency-name: napi-derive
        versions: ['3.6.10']
      - dependency-name: gltf
      - dependency-name: num-bigint
      - dependency-name: num-integer
      - dependency-name: num-rational
      - dependency-name: num-traits
      - dependency-name: regress
      - dependency-name: ryu-js
      - dependency-name: serde
      - dependency-name: serde_json
      - dependency-name: sha2
    groups:
      rust:
        patterns: ['*']
