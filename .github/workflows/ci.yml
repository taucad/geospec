# One workflow, one required check: `ci-gate`.
#
# Repository jobs (quality, docs-prose, security) run on every event. Engine
# jobs run only once the engine package exists at `names.json` `engine.root`;
# before that `ci-gate` expects them skipped, so the workspace scaffold is
# green on its own and the same file becomes the engine's pipeline when the
# engine history lands.
#
# The engine's Nx project provides four CI targets this file calls by name:
#   ci-cache-key  prints the OCCT preparation generation for this host (64 hex digits)
#   ci-native     builds the NAPI addon for $GEOSPEC_NAPI_TARGET and the CPython
#                 wheels into out/ci/<suffix>/
#   ci-wasm       builds the WASM module into out/ci/wasm/
#   build         builds dist/ from the products placed back into the package
#
# Build once, test the frozen candidate, publish that candidate:
#   producer (per platform, plus the WASM host; a Linux platform builds in its
#   pinned manylinux container) -> assemble -> consumer (plus the glibc floor)
#   -> publish-dry-run on pull requests and on main pushes while npm is off,
#   or publish-npm / publish-pypi on main -> registry-verify.
# A stable release also waits for `qualify` (release qualification of this
# run's candidate) and refuses to publish unless it passed.
# While `names.json` keeps npm off, a main push still stamps its `next`
# version, so the dry run rehearses the exact candidate a publish would send.
# A push of an exact `chore(release): geospec-engine v<version>` commit
# publishes `latest` (and the wheel to PyPI); any other push to main publishes
# a `next` prerelease. Both are off until `names.json` `publish` enables them.
#
# Runner route: preflight decides once (`scripts/ci-plan.mjs` `routeRunners`)
# whether a `names.json` row's `selfHosted` runner replaces its hosted label.
# Only a push or dispatch on main and, while `ci.selfHostedPullRequests` is
# on, a same-repository pull request not from Dependabot go self-hosted; a
# fork pull request never does. Each matrix row carries its `runsOn`, and the
# qualification workflows receive `runner-routes`. A job on the persistent
# self-hosted runner empties its workspace before checkout and when it ends.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'publish-main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Where the engine's delivery preparation keeps its compiled OCCT generations
  # (native and WASM). Restoring it turns a 70-90 minute cold build into a
  # products-only build.
  OCCT_PREPARATION_PATH: node_modules/.cache/geospec-engine-native/delivery-wasm-eh/generations

jobs:
  preflight:
    runs-on: ubuntu-24.04
    outputs:
      engine: ${{ steps.plan.outputs.engine }}
      engine-root: ${{ steps.plan.outputs.engine-root }}
      engine-project: ${{ steps.plan.outputs.engine-project }}
      npm-name: ${{ steps.plan.outputs.npm-name }}
      producers: ${{ steps.plan.outputs.producers }}
      container-producers: ${{ steps.plan.outputs.container-producers }}
      consumers: ${{ steps.plan.outputs.consumers }}
      floor-consumers: ${{ steps.plan.outputs.floor-consumers }}
      runner-routes: ${{ steps.plan.outputs.runner-routes }}
      kind: ${{ steps.release.outputs.kind }}
      npm-publish: ${{ steps.release.outputs.npm_publish }}
      pypi-publish: ${{ steps.release.outputs.pypi_publish }}
      dist-tag: ${{ steps.release.outputs.dist_tag }}
      version: ${{ steps.release.outputs.version }}
      relink-kit: ${{ steps.relink.outputs.relink-kit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - id: plan
        run: node scripts/ci-plan.mjs
      - id: release
        env:
          BASE_REF: ${{ github.base_ref }}
          ENGINE: ${{ steps.plan.outputs.engine }}
          EVENT_NAME: ${{ github.event_name }}
          PACKAGE_VERSION: ${{ steps.plan.outputs.package-version }}
          REF_NAME: ${{ github.ref }}
          RUN_NUMBER: ${{ github.run_number }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [[ "$EVENT_NAME" == pull_request ]]; then
            git diff --name-only --diff-filter=ACDMRT "origin/$BASE_REF...$SOURCE_SHA" > /tmp/changed-files
          else
            git diff-tree --no-commit-id --name-only --diff-filter=ACDMRT -r HEAD > /tmp/changed-files
          fi
          node scripts/ci-release.mjs \
            --event "$EVENT_NAME" \
            --ref "$REF_NAME" \
            --sha "$SOURCE_SHA" \
            --run-number "$RUN_NUMBER" \
            --engine "$ENGINE" \
            --package-version "$PACKAGE_VERSION" \
            --subject "$(git log -1 --pretty=%s "$SOURCE_SHA")" \
            --changed-files-file /tmp/changed-files
      # The kit needs a second Darwin products build, so it is generated only
      # when a publish can follow (main, a release PR, dispatch) or when a pull
      # request changes the kit, its licence binding or the delivery route.
      - id: relink
        name: Decide whether this run builds the source and relink kit
        env:
          KIND: ${{ steps.release.outputs.kind }}
        run: node scripts/relink-release.mjs plan --kind "$KIND" --changed-files-file /tmp/changed-files >> "$GITHUB_OUTPUT"
      - name: Require every release platform for a stable release
        if: steps.release.outputs.kind == 'release' && steps.plan.outputs.engine == 'true'
        run: node scripts/ci-plan.mjs --release

  quality:
    needs: preflight
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          node-version: '24'
      - run: pnpm nx run geospec-repo:quality
      - name: Require a Version Plan for release-affecting changes
        if: needs.preflight.outputs.engine == 'true' && needs.preflight.outputs.kind != 'release-pull-request' && needs.preflight.outputs.kind != 'release'
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$EVENT_NAME" == pull_request ]]; then
            pnpm nx release plan:check --base="origin/$BASE_REF" --head=HEAD
          elif [[ "$EVENT_NAME" == push ]]; then
            if [[ "$BEFORE_SHA" == 0000000000000000000000000000000000000000 ]]; then
              echo "::error::Cannot validate Version Plans without a previous push SHA"
              exit 1
            fi
            git merge-base --is-ancestor "$BEFORE_SHA" HEAD || {
              echo "::error::Cannot validate Version Plans across a force-push"
              exit 1
            }
            pnpm nx release plan:check --base="$BEFORE_SHA" --head=HEAD
          else
            pnpm nx release plan:check --base=HEAD~1 --head=HEAD
          fi

  docs-prose:
    needs: preflight
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          node-version: '24'
      # The route sweep uses Chromium; the live demo e2e runs in Chromium, Firefox and WebKit.
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      # Builds the site, sweeps every exported route in both themes at desktop and phone width,
      # runs the docs tests and the live demo in all three browsers, then Vale and the prose and
      # README shape tests.
      - run: pnpm nx run geospec-repo:docs-prose
      # Needs the exported site, which the docs-prose target has just built.
      - if: github.event_name == 'pull_request'
        run: pnpm run docs:links --internal-only
      - if: github.event_name != 'pull_request'
        run: pnpm run docs:links

  security:
    needs: preflight
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          node-version: '24'
      - run: pnpm audit --audit-level high
      - uses: taiki-e/install-action@183e4297cca2404691e9380e1307288dced5c82a # v2
        if: needs.preflight.outputs.engine == 'true'
        with:
          tool: cargo-deny@0.20.2
      - name: Check every engine Cargo workspace against deny.toml
        if: needs.preflight.outputs.engine == 'true'
        env:
          ENGINE_ROOT: ${{ needs.preflight.outputs.engine-root }}
        run: |
          set -euo pipefail
          while IFS= read -r lockfile; do
            echo "::group::cargo deny $(dirname "$lockfile")"
            cargo deny --manifest-path "$(dirname "$lockfile")/Cargo.toml" --config deny.toml check
            echo '::endgroup::'
          done < <(git ls-files "$ENGINE_ROOT/**/Cargo.lock")

  engine-checks:
    if: needs.preflight.outputs.engine == 'true'
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      ENGINE_PROJECT: ${{ needs.preflight.outputs.engine-project }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          node-version: '24'
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install
      - run: pnpm nx run-many --projects="$ENGINE_PROJECT" --targets=lint,typecheck,format-rust,clippy-rust,test-rust,check-wasm,test-m3-campaign,test-m3-verdicts --parallel=1

  producer:
    name: producer (${{ matrix.suffix }})
    if: needs.preflight.outputs.engine == 'true' && needs.preflight.outputs.producers != '[]'
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.preflight.outputs.producers || '[]') }}
    runs-on: ${{ matrix.runsOn }}
    timeout-minutes: 240
    env:
      ENGINE_PROJECT: ${{ needs.preflight.outputs.engine-project }}
      ENGINE_ROOT: ${{ needs.preflight.outputs.engine-root }}
      GEOSPEC_NAPI_TARGET: ${{ matrix.triple }}
      GEOSPEC_RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
    steps:
      - name: Empty the persistent runner's workspace
        if: runner.environment == 'self-hosted'
        run: chmod -R u+w "$GITHUB_WORKSPACE" && find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 -exec rm -rf {} +
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: runner.environment == 'self-hosted'
        uses: ./.github/actions/self-hosted-mac
        with:
          build: 'true'
          python: '3.13 3.14'
      - uses: ./.github/actions/setup
        with:
          node-version: '24'
      - if: runner.environment != 'self-hosted'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: |
            3.14
            3.13
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install
      # The generation digests the OCCT recipe and every host compiler and SDK,
      # so a runner-image update selects a new, empty preparation rather than a
      # stale one.
      - id: generation
        name: Select the OCCT preparation generation
        run: |
          set -euo pipefail
          # Nx prints its run summary after the task output, so select the
          # generation line rather than the last line.
          generation="$(pnpm --silent nx run "$ENGINE_PROJECT:ci-cache-key" --skip-nx-cache --output-style=stream-without-prefixes | grep -xE '[0-9a-f]{64}' | tail -n 1)"
          test -n "$generation"
          echo "generation=${generation}" >> "$GITHUB_OUTPUT"
          echo "key=occt-v1-${{ matrix.suffix }}-${generation}" >> "$GITHUB_OUTPUT"
      - id: preparation
        name: Restore the retained OCCT preparation
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: ${{ steps.generation.outputs.key }}
          path: ${{ env.OCCT_PREPARATION_PATH }}
      - name: Build the NAPI addon and wheels
        if: matrix.triple != ''
        run: pnpm nx run "$ENGINE_PROJECT:ci-native" --skip-nx-cache
      # The OCCT goldens' report soups are exact per Rust target triple, and only
      # the generator writes them. ci-native tests this host's entry against its
      # own prefix; this step then runs the generator against the same prefix
      # and, when the written file differs, prints it between markers so the
      # generator's own output can be committed from the log.
      - name: Print generated OCCT goldens that differ
        if: ${{ !cancelled() && matrix.triple != '' && runner.os == 'macOS' }}
        env:
          GEOSPEC_OCCT_PREFIX: ${{ github.workspace }}/node_modules/.cache/geospec-engine-native/delivery-wasm-eh/generations/${{ steps.generation.outputs.generation }}/occt-native/install
        run: |
          set -euo pipefail
          test -d "$GEOSPEC_OCCT_PREFIX"
          goldens="$ENGINE_ROOT/native/occt/rust/tests/fixtures/occt-goldens.json"
          pnpm nx run "$ENGINE_PROJECT:generate-occt-goldens" --skip-nx-cache
          if git diff --quiet -- "$goldens"; then
            echo "OCCT goldens: the generator reproduces $goldens"
          else
            echo "----- BEGIN GENERATED $goldens ($GEOSPEC_NAPI_TARGET) -----"
            cat "$goldens"
            echo "----- END GENERATED $goldens ($GEOSPEC_NAPI_TARGET) -----"
            echo "::error file=$goldens::the generator's output on $GEOSPEC_NAPI_TARGET differs from the committed goldens"
            exit 1
          fi
      - name: Build the WASM module
        if: matrix.wasm
        run: pnpm nx run "$ENGINE_PROJECT:ci-wasm" --skip-nx-cache
      # Only main saves, so pull requests share one entry instead of each
      # storing gigabytes against the repository's cache quota.
      - name: Retain the OCCT preparation
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.preparation.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: ${{ steps.generation.outputs.key }}
          path: ${{ env.OCCT_PREPARATION_PATH }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: products-${{ matrix.suffix }}
          path: out/ci/
          if-no-files-found: error
          retention-days: ${{ needs.preflight.outputs.kind == 'release' && 30 || 3 }}
      # OCCT is compiled into the engine under LGPL 2.1, so every published
      # version ships with a source and relink kit. The engine's delivery route
      # generates it for this commit from the OCCT preparation above, with the
      # licence tree whose SOURCE-RELINK.json binds that exact kit; assemble
      # ships the tree and registry-verify attaches the kit to `v<version>`.
      # It runs after the cache save, which keeps its build directories out of
      # the retained preparation. `prepare` rebuilds the addon and the mixed
      # WASM to record its own producer proof; that build uses this commit and
      # this OCCT generation, which is the correspondence relinking needs.
      - name: Generate the source and relink kit
        if: matrix.wasm && needs.preflight.outputs.relink-kit == 'true'
        run: |
          set -euo pipefail
          node "$ENGINE_ROOT/scripts/ci-artifacts.mjs" prepare
          assembly="$(sed -n 's/^ASSEMBLY_ROOT=//p' out/artifacts/geospec-native-engine/ci/assemble-package.stdout)"
          test "$(printf '%s\n' "$assembly" | wc -l)" -eq 1 && test -d "$assembly"
          mkdir -p out/relink
          cp -R "$assembly/licenses" out/relink/licenses
          cp "$assembly/tarballs/geospec-engine-native-source-relink.tar.gz" out/relink/
      - if: matrix.wasm && needs.preflight.outputs.relink-kit == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: source-relink-kit
          path: out/relink/
          if-no-files-found: error
          retention-days: ${{ needs.preflight.outputs.kind == 'release' && 30 || 3 }}
      - name: Empty the persistent runner's workspace
        if: always() && runner.environment == 'self-hosted'
        # Keeps .github: the post steps of local actions read their action.yml.
        # chmod first: the OCCT source verification leaves read-only trees.
        run: chmod -R u+w "$GITHUB_WORKSPACE" && find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 ! -name .github -exec rm -rf {} +

  # A Linux producer builds inside its pinned manylinux image, so the addon and
  # wheels link against that image's glibc floor and the wheels carry a
  # manylinux tag PyPI accepts. The image brings the gcc toolset and CPython
  # 3.13 and 3.14; this job adds the tools the OCCT build needs and Rust.
  producer-linux:
    name: producer (${{ matrix.suffix }})
    if: needs.preflight.outputs.engine == 'true' && needs.preflight.outputs.container-producers != '[]'
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.preflight.outputs.container-producers || '[]') }}
    runs-on: ${{ matrix.runsOn }}
    container:
      image: ${{ matrix.container }}
    timeout-minutes: 240
    env:
      ENGINE_PROJECT: ${{ needs.preflight.outputs.engine-project }}
      GEOSPEC_NAPI_TARGET: ${{ matrix.triple }}
      GEOSPEC_PRODUCER_CONTAINER: ${{ matrix.container }}
      GEOSPEC_RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
      GEOSPEC_PYTHON313: /opt/python/cp313-cp313/bin/python3.13
      GEOSPEC_PYTHON314: /opt/python/cp314-cp314/bin/python3.14
      GEOSPEC_OCCT_JOBS: '4'
    steps:
      - name: Install the build tools the image lacks
        run: dnf install -y --setopt=install_weak_deps=False diffutils findutils git ninja-build patch perl-Digest-SHA tar
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select the image's CPython 3.13 as python3
        run: echo /opt/python/cp313-cp313/bin >> "$GITHUB_PATH"
      - uses: ./.github/actions/setup
        with:
          node-version: '24'
      - name: Install rustup and the pinned Rust toolchain
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64) sha256=20a06e644b0d9bd2fbdbfd52d42540bdde820ea7df86e92e533c073da0cdd43c ;;
            *) echo "::error::no pinned rustup-init for $(uname -m)"; exit 1 ;;
          esac
          curl --proto '=https' --tlsv1.2 --fail --location --retry 3 --output /tmp/rustup-init \
            "https://static.rust-lang.org/rustup/archive/1.28.2/$(uname -m)-unknown-linux-gnu/rustup-init"
          echo "$sha256  /tmp/rustup-init" | sha256sum --check --strict
          chmod +x /tmp/rustup-init
          /tmp/rustup-init -y --no-modify-path --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/rustup" toolchain install
      # The generation digests the Linux recipe, the image, the compiler, its
      # headers and the C library, so a new image selects a new preparation.
      - id: generation
        name: Select the OCCT preparation generation
        run: |
          set -euo pipefail
          generation="$(pnpm --silent nx run "$ENGINE_PROJECT:ci-cache-key" --skip-nx-cache --output-style=stream-without-prefixes | grep -xE '[0-9a-f]{64}' | tail -n 1)"
          test -n "$generation"
          echo "key=occt-v1-${{ matrix.suffix }}-${generation}" >> "$GITHUB_OUTPUT"
      - id: preparation
        name: Restore the retained OCCT preparation
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          key: ${{ steps.generation.outputs.key }}
          path: ${{ env.OCCT_PREPARATION_PATH }}
      # Builds the native OCCT prefix, the addon (which then passes the early
      # and material conformance suites) and both wheels, then refuses a glibc,
      # GLIBCXX or manylinux tag above the recipe floor.
      - name: Build the NAPI addon and wheels
        run: pnpm nx run "$ENGINE_PROJECT:ci-native" --skip-nx-cache
      - name: Retain the OCCT preparation
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.preparation.outputs.cache-hit != 'true'
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          key: ${{ steps.generation.outputs.key }}
          path: ${{ env.OCCT_PREPARATION_PATH }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: products-${{ matrix.suffix }}
          path: out/ci/
          if-no-files-found: error
          retention-days: ${{ needs.preflight.outputs.kind == 'release' && 30 || 3 }}

  assemble:
    if: ${{ !cancelled() && !failure() && needs.preflight.outputs.engine == 'true' }}
    needs: [preflight, quality, engine-checks, producer, producer-linux]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      relink-verified: ${{ steps.relink-verify.outputs.verified }}
    env:
      ENGINE_PROJECT: ${{ needs.preflight.outputs.engine-project }}
      ENGINE_ROOT: ${{ needs.preflight.outputs.engine-root }}
      VERSION: ${{ needs.preflight.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          node-version: '24'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: products-*
          path: out/ci
          merge-multiple: true
      - if: needs.preflight.outputs.relink-kit == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: source-relink-kit
          path: out/relink
      # The packages carry the licence tree generated beside the kit, so their
      # SOURCE-RELINK.json names the kit this run attaches to its release. The
      # tracked tree's file set must still match; its relink binding is only a
      # reference to the run that generated it.
      - name: Ship the licence tree generated with the source and relink kit
        if: needs.preflight.outputs.relink-kit == 'true'
        run: >-
          node scripts/relink-release.mjs adopt --licenses out/relink/licenses
          --kit out/relink/geospec-engine-native-source-relink.tar.gz --package "$ENGINE_ROOT"
      - name: Stamp the candidate version
        working-directory: ${{ env.ENGINE_ROOT }}
        run: npm version "$VERSION" --no-git-tag-version --allow-same-version
      - run: pnpm nx run "$ENGINE_PROJECT:build"
      # Every `pnpm` command must precede `napi pre-publish`: it rewrites the
      # manifest's optionalDependencies, after which pnpm's pre-run dependency
      # check refuses the now-stale lockfile. From there on only `node` and
      # `npm` run.
      - name: Generate the platform packages and collect the addons
        working-directory: ${{ env.ENGINE_ROOT }}
        run: |
          set -euo pipefail
          pnpm exec napi create-npm-dirs --npm-dir npm
          pnpm exec napi artifacts --output-dir "$GITHUB_WORKSPACE/out/ci" --npm-dir npm
          node "$GITHUB_WORKSPACE/scripts/platform-notices.mjs" npm
      - name: Reconcile the platform manifests without publishing
        working-directory: ${{ env.ENGINE_ROOT }}
        run: ./node_modules/.bin/napi pre-publish --skip-optional-publish -t npm --no-gh-release
      - name: Pack the frozen candidate
        run: |
          set -euo pipefail
          mkdir -p candidate
          for directory in "$ENGINE_ROOT"/npm/*/; do npm pack "./$directory" --ignore-scripts --pack-destination candidate; done
          # npm pack ignores publishConfig.exports and .imports, which point the
          # published manifest at dist/ instead of the workspace sources.
          node scripts/apply-publish-config.mjs "$ENGINE_ROOT/package.json"
          npm pack "./$ENGINE_ROOT" --ignore-scripts --pack-destination candidate
          node scripts/candidate-manifest.mjs candidate
      # Missing and extra files both fail; then every export resolves to ESM
      # with types. `wasm-binary` is an asset path, not a module.
      - name: Check the candidate's file contract and export types
        run: |
          set -euo pipefail
          node scripts/validate-candidate.mjs candidate
          root="$(node -p "require('./candidate/manifest.json').packages.at(-1).filename")"
          ./node_modules/.bin/attw "candidate/$root" --profile esm-only --exclude-entrypoints wasm-binary
      - id: relink-verify
        name: Require every candidate receipt to bind the source and relink kit
        if: needs.preflight.outputs.relink-kit == 'true'
        run: |
          set -euo pipefail
          node scripts/relink-release.mjs verify --candidate candidate --kit out/relink/geospec-engine-native-source-relink.tar.gz
          echo verified=true >> "$GITHUB_OUTPUT"
      - name: Collect the wheels
        run: |
          set -euo pipefail
          mkdir -p wheels
          find out/ci -name '*.whl' -exec cp {} wheels/ \;
          ls -l wheels
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-candidate
          path: candidate/
          if-no-files-found: error
          retention-days: ${{ needs.preflight.outputs.kind == 'release' && 30 || 3 }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheels
          path: wheels/
          if-no-files-found: error
          retention-days: ${{ needs.preflight.outputs.kind == 'release' && 30 || 3 }}

  consumer:
    name: consumer (${{ matrix.suffix }}, Node ${{ matrix.node }})
    if: needs.preflight.outputs.engine == 'true' && needs.preflight.outputs.consumers != '[]'
    needs: [preflight, assemble]
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.preflight.outputs.consumers || '[]') }}
    runs-on: ${{ matrix.runsOn }}
    steps:
      - name: Empty the persistent runner's workspace
        if: runner.environment == 'self-hosted'
        run: chmod -R u+w "$GITHUB_WORKSPACE" && find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 -exec rm -rf {} +
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: runner.environment == 'self-hosted'
        uses: ./.github/actions/self-hosted-mac
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-candidate
          path: candidate
      - run: node scripts/smoke-candidate.mjs --candidate candidate --suffix ${{ matrix.suffix }}
      - name: Empty the persistent runner's workspace
        if: always() && runner.environment == 'self-hosted'
        # Keeps .github: the post steps of local actions read their action.yml.
        # chmod first: the OCCT source verification leaves read-only trees.
        run: chmod -R u+w "$GITHUB_WORKSPACE" && find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 ! -name .github -exec rm -rf {} +

  # The oldest distribution a platform supports (glibc 2.28 for linux-x64-gnu)
  # installs the same candidate and must load its native addon.
  consumer-floor:
    name: consumer (${{ matrix.suffix }}, Node ${{ matrix.node }}, glibc floor)
    if: needs.preflight.outputs.engine == 'true' && needs.preflight.outputs.floor-consumers != '[]'
    needs: [preflight, assemble]
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.preflight.outputs.floor-consumers || '[]') }}
    runs-on: ${{ matrix.runsOn }}
    container:
      image: ${{ matrix.container }}
    steps:
      - name: Install the tools checkout and setup-node need
        run: dnf install -y --setopt=install_weak_deps=False git gzip tar xz
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: npm-candidate
          path: candidate
      - run: node scripts/smoke-candidate.mjs --candidate candidate --suffix ${{ matrix.suffix }}

  publish-dry-run:
    if: >-
      needs.preflight.outputs.engine == 'true' &&
      (github.event_name == 'pull_request' ||
      (github.event_name == 'push' && needs.preflight.outputs.npm-publish != 'true'))
    needs: [preflight, assemble]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-candidate
          path: candidate
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: wheels
          path: wheels
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - name: Dry-run every npm publish in order
        env:
          DIST_TAG: ${{ needs.preflight.outputs.kind == 'release' && 'latest' || 'next' }}
        run: |
          set -euo pipefail
          node -e "for (const p of require('./candidate/manifest.json').packages) console.log(p.filename)" > /tmp/filenames
          while IFS= read -r filename; do
            npm publish "./candidate/$filename" --access public --tag "$DIST_TAG" --dry-run </dev/null
          done < /tmp/filenames
      - name: Check the wheels PyPI would receive
        run: pipx run twine==6.2.0 check --strict wheels/*.whl

  publish-npm:
    # `qualify` skips on a `next` push, so the job states its other needs'
    # success itself instead of the implicit success() a skipped need fails.
    if: >-
      !cancelled() && needs.preflight.outputs.npm-publish == 'true' &&
      needs.assemble.result == 'success' && needs.consumer.result == 'success' &&
      needs.consumer-floor.result == 'success' && needs.docs-prose.result == 'success' &&
      needs.security.result == 'success'
    needs: [preflight, assemble, consumer, consumer-floor, docs-prose, security, qualify]
    runs-on: ubuntu-24.04
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      # A stable release publishes only after its own release qualification
      # passed; a `next` prerelease (kind main) has no qualification to wait for.
      - name: Require release qualification for a stable release
        env:
          KIND: ${{ needs.preflight.outputs.kind }}
          QUALIFY: ${{ needs.qualify.result }}
        run: |
          if [[ "$KIND" == release && "$QUALIFY" != success ]]; then
            echo "::error::release qualification did not pass (qualify: $QUALIFY); refusing to publish a stable release."
            exit 1
          fi
      # A publish without a verified source and relink kit refuses, never skips.
      - name: Require the verified source and relink kit
        env:
          RELINK_VERIFIED: ${{ needs.assemble.outputs.relink-verified }}
        run: |
          if [[ "$RELINK_VERIFIED" != 'true' ]]; then
            echo "::error::assemble did not verify the source and relink kit; refusing to publish."
            exit 1
          fi
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-candidate
          path: candidate
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      # The manifest lists the platform packages before the root package, so a
      # root version never points at an optional dependency that is missing.
      - name: Publish exact candidates with provenance
        env:
          DIST_TAG: ${{ needs.preflight.outputs.dist-tag }}
        run: |
          set -euo pipefail
          node -e "for (const p of require('./candidate/manifest.json').packages) console.log([p.name,p.version,p.filename,p.integrity].join('\t'))" > /tmp/packages
          while IFS=$'\t' read -r name version filename integrity; do
            published="$(npm view "$name@$version" dist.integrity 2>/dev/null || true)"
            if [[ -n "$published" ]]; then
              if [[ "$published" != "$integrity" ]]; then
                echo "::error::registry integrity differs for $name@$version"
                exit 1
              fi
              continue
            fi
            if [[ -n "$(npm view "$name@$version" version 2>/dev/null || true)" ]]; then
              echo "::error::registry returned $name@$version without dist.integrity"
              exit 1
            fi
            npm publish "./candidate/$filename" --access public --provenance --tag "$DIST_TAG" </dev/null
          done < /tmp/packages

  publish-pypi:
    # `qualify` skips on a `next` push, so the job states its other needs'
    # success itself instead of the implicit success() a skipped need fails.
    if: >-
      !cancelled() && needs.preflight.outputs.pypi-publish == 'true' &&
      needs.assemble.result == 'success' && needs.consumer.result == 'success' &&
      needs.consumer-floor.result == 'success' && needs.docs-prose.result == 'success' &&
      needs.security.result == 'success'
    needs: [preflight, assemble, consumer, consumer-floor, docs-prose, security, qualify]
    runs-on: ubuntu-24.04
    environment: pypi-publish
    permissions:
      contents: read
      id-token: write
    steps:
      # A stable release publishes only after its own release qualification
      # passed; a `next` prerelease (kind main) has no qualification to wait for.
      - name: Require release qualification for a stable release
        env:
          KIND: ${{ needs.preflight.outputs.kind }}
          QUALIFY: ${{ needs.qualify.result }}
        run: |
          if [[ "$KIND" == release && "$QUALIFY" != success ]]; then
            echo "::error::release qualification did not pass (qualify: $QUALIFY); refusing to publish a stable release."
            exit 1
          fi
      # A publish without a verified source and relink kit refuses, never skips.
      - name: Require the verified source and relink kit
        env:
          RELINK_VERIFIED: ${{ needs.assemble.outputs.relink-verified }}
        run: |
          if [[ "$RELINK_VERIFIED" != 'true' ]]; then
            echo "::error::assemble did not verify the source and relink kit; refusing to publish."
            exit 1
          fi
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: wheels
          path: wheels
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: wheels/
          skip-existing: true

  registry-verify:
    if: always() && needs.preflight.outputs.npm-publish == 'true' && needs.publish-npm.result == 'success'
    needs: [preflight, assemble, publish-npm]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-candidate
          path: candidate
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: source-relink-kit
          path: relink
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - name: Wait for the registry to serve every candidate with its attestation
        run: node scripts/registry-wait.mjs --manifest candidate/manifest.json
      - name: Check registry bytes and provenance
        shell: bash
        run: |
          workspace="$PWD"
          directory="$(mktemp -d)"
          cd "$directory"
          npm init --yes >/dev/null
          mapfile -t package_specs < <(node -e "for (const p of require('$workspace/candidate/manifest.json').packages) console.log(p.name+'@'+p.version)")
          npm install --force --ignore-scripts "${package_specs[@]}"
          npm audit signatures --json --include-attestations > /tmp/npm-audit-signatures.json
          cd "$workspace"
          node scripts/verify-release-attestations.mjs \
            /tmp/npm-audit-signatures.json \
            candidate/manifest.json \
            '${{ github.sha }}' \
            '${{ github.run_id }}'
      # Every published version, `next` prereleases included, gets release
      # `v<version>` on this commit with the kit its SOURCE-RELINK.json names
      # and `<kit>.sha256`. A rerun keeps identical assets; a differing asset
      # or tag is refused, never replaced.
      - name: Record the release with its source and relink kit
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.preflight.outputs.version }}
        run: >-
          node scripts/relink-release.mjs publish --candidate candidate
          --kit relink/geospec-engine-native-source-relink.tar.gz
          --version "$VERSION" --sha "$GITHUB_SHA" --repo "$GITHUB_REPOSITORY"

  # Release qualification for the release pull request and the exact release
  # commit only; ordinary pull requests and main pushes skip it. It
  # qualifies this run's own frozen candidate: the Node, CPython and browser
  # matrix (qualify.yml), the S10 probes with the injected cells
  # (qualify-s10.yml) and the regression campaign with the Q7 report
  # (bench.yml). Each reusable workflow downloads this run's npm-candidate and
  # wheels, so every caller grants `actions: read`. `qualify` then decides on
  # every ledger together: a cell that holds the release fails it when it fails
  # or goes missing; an inconclusive regression decision and every Q7 row are
  # recorded without holding the release.
  qualify-matrix:
    if: >-
      needs.preflight.outputs.engine == 'true' &&
      (needs.preflight.outputs.kind == 'release-pull-request' || needs.preflight.outputs.kind == 'release')
    needs: [preflight, assemble]
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/qualify.yml
    with:
      run-id: ${{ github.run_id }}
      macos: true
      release: true
      runner-routes: ${{ needs.preflight.outputs.runner-routes }}

  qualify-s10:
    if: >-
      needs.preflight.outputs.engine == 'true' &&
      (needs.preflight.outputs.kind == 'release-pull-request' || needs.preflight.outputs.kind == 'release')
    needs: [preflight, assemble]
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/qualify-s10.yml
    with:
      ci-run-id: ${{ github.run_id }}
      injected: true
      scope: all
      runner-routes: ${{ needs.preflight.outputs.runner-routes }}

  qualify-bench:
    if: >-
      needs.preflight.outputs.engine == 'true' &&
      (needs.preflight.outputs.kind == 'release-pull-request' || needs.preflight.outputs.kind == 'release')
    needs: [preflight, assemble]
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/bench.yml
    with:
      candidate-run-id: ${{ github.run_id }}

  qualify:
    if: >-
      always() && needs.preflight.outputs.engine == 'true' &&
      (needs.preflight.outputs.kind == 'release-pull-request' || needs.preflight.outputs.kind == 'release')
    needs: [preflight, qualify-matrix, qualify-s10, qualify-bench]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: qualify-leg-*
          path: out/qualify/downloaded
      # A benchmark run that wrote no ledger leaves its cells missing, which
      # the gate refuses; the download itself must not stop the decision.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        continue-on-error: true
        with:
          name: bench-ledger
          path: out/bench
      - name: Lay out one directory per leg
        run: |
          set -euo pipefail
          mkdir -p out/qualify/legs
          for directory in out/qualify/downloaded/qualify-leg-*; do
            [[ -d "$directory" ]] || continue
            mv "$directory" "out/qualify/legs/$(basename "$directory" | sed 's/^qualify-leg-//')"
          done
      - name: Compare JS and Python canonical results
        run: node scripts/qualify/canonical-equality.mjs --legs out/qualify/legs --out out/qualify/legs/equality/ledger.json
      - name: Add the benchmark leg
        run: >-
          node scripts/qualify/bench-leg.mjs --regression out/bench/w10-ledger.json
          --q7 out/bench/q7/q7-ledger.json --out out/qualify/legs/bench/ledger.json
      - name: Decide
        run: >-
          node scripts/qualify/qualification-gate.mjs --legs out/qualify/legs --out out/qualify/summary.json
          --require-leg plan --require-leg bench
      # The matrix and S10 workflows decide their own cells; both must pass.
      # The benchmark workflow fails on infrastructure as well as on a
      # regression, so its ledger, not its result, decides above.
      - name: Require the matrix and S10 qualification
        env:
          MATRIX: ${{ needs.qualify-matrix.result }}
          S10: ${{ needs.qualify-s10.result }}
          BENCH: ${{ needs.qualify-bench.result }}
          DECISION: ${{ needs.qualify-bench.outputs.decision }}
        run: |
          echo "qualify-matrix: $MATRIX; qualify-s10: $S10; qualify-bench: $BENCH (decision ${DECISION:-none})"
          if [[ "$MATRIX" != success || "$S10" != success ]]; then
            echo "::error::release qualification needs qualify-matrix and qualify-s10 to succeed"
            exit 1
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: qualify-release-summary
          path: out/qualify/
          if-no-files-found: error

  ci-gate:
    if: always()
    needs:
      [
        preflight,
        quality,
        docs-prose,
        security,
        engine-checks,
        producer,
        producer-linux,
        assemble,
        consumer,
        consumer-floor,
        publish-dry-run,
        publish-npm,
        publish-pypi,
        registry-verify,
        qualify,
      ]
    runs-on: ubuntu-24.04
    steps:
      - name: Assert required job results and expected skips
        env:
          RESULTS: ${{ toJSON(needs) }}
          ENGINE: ${{ needs.preflight.outputs.engine }}
          EVENT_NAME: ${{ github.event_name }}
          KIND: ${{ needs.preflight.outputs.kind }}
          NPM_PUBLISH: ${{ needs.preflight.outputs.npm-publish }}
          PYPI_PUBLISH: ${{ needs.preflight.outputs.pypi-publish }}
          CONTAINER_PRODUCERS: ${{ needs.preflight.outputs.container-producers }}
          FLOOR_CONSUMERS: ${{ needs.preflight.outputs.floor-consumers }}
        run: |
          node <<'NODE'
          const needs = JSON.parse(process.env.RESULTS);
          const required = ['preflight', 'quality', 'docs-prose', 'security'];
          if (process.env.ENGINE === 'true') {
            required.push('engine-checks', 'producer', 'assemble', 'consumer');
            if (process.env.CONTAINER_PRODUCERS !== '[]') required.push('producer-linux');
            if (process.env.FLOOR_CONSUMERS !== '[]') required.push('consumer-floor');
            if (process.env.EVENT_NAME === 'pull_request') required.push('publish-dry-run');
            if (process.env.EVENT_NAME === 'push' && process.env.NPM_PUBLISH !== 'true') required.push('publish-dry-run');
            if (process.env.NPM_PUBLISH === 'true') required.push('publish-npm', 'registry-verify');
            if (process.env.PYPI_PUBLISH === 'true') required.push('publish-pypi');
            // Release qualification runs for, and is required by, the release kinds only.
            if (['release-pull-request', 'release'].includes(process.env.KIND)) required.push('qualify');
          }
          const failures = required
            .filter((name) => needs[name]?.result !== 'success')
            .map((name) => `${name} (${needs[name]?.result ?? 'missing'})`);
          const unexpected = Object.keys(needs)
            .filter((name) => !required.includes(name) && needs[name].result !== 'skipped')
            .map((name) => `${name} ran (${needs[name].result}) but this event expects it skipped`);
          const problems = [...failures, ...unexpected];
          if (problems.length) throw new Error(`ci-gate: ${problems.join('; ')}`);
          console.log(`ci-gate: ${required.join(', ')} passed; ${Object.keys(needs).length - required.length} expected skips`);
          NODE
