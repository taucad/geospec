# Qualify a frozen `ci.yml` candidate before it ships (items Q-2, Q-3 and Q-4).
#
# The input is a `ci.yml` run id; every leg downloads that run's
# `npm-candidate` and `wheels` artifacts and tests the bytes it would publish,
# never a rebuild:
#   plan     predeclares every cell from `names.json` and the candidate
#   node     host x Node 24/26: corpus conformance of the installed consumer,
#            native addon (when the candidate carries the host's prebuild) and
#            WASM-in-Node, standalone and through the Vitest adapter, plus
#            the subject-lifecycle host test through the native facade
#   python   host x CPython 3.13/3.14 (when the candidate has the wheel): the
#            binding and lifecycle tests against the installed wheel, plus the
#            corpus reports
#   browser  Chromium, Firefox and WebKit on Linux, WebKit on macOS: the WASM
#            route in the browser through the installed consumer
#   gate     JS/Python canonical-result equality, then every ledger into
#            `out/qualify/summary.json`; fails unless every predeclared cell
#            passed or resolved unsupported where the plan allows it
#
# Sibling legs (the S10 probes, the benchmark campaign) join by uploading a
# `qualify-leg-<leg>` artifact that holds a `ledger.json`.
# macOS legs share Tau's five macOS slots: they run on dispatch and for
# release pull requests; a caller passes `macos: false` otherwise. A pull
# request that changes the qualification machinery runs the Linux legs against
# its own `ci.yml` candidate, so harness expectations and engine bytes from the
# same commit are qualified together; when that run builds no candidate (no
# engine change), the legs run against the latest successful `main` candidate.
# A ci.yml caller passes its planned `runner-routes`; a leg whose hosted
# runner has a self-hosted replacement there runs on it, and every other run
# (dispatch, pull request) stays on the hosted runners.
name: Qualify

on:
  workflow_dispatch:
    inputs:
      run-id:
        description: The ci.yml run whose npm-candidate and wheels to qualify
        required: true
        type: string
      macos:
        description: Run the macOS legs
        type: boolean
        default: true
      release:
        description: Qualify a stable release (every requiredForRelease host must be present)
        type: boolean
        default: false
  pull_request:
    paths:
      - .github/workflows/qualify.yml
      - scripts/qualify/**
      - packages/geospec-engine/bindings/browser-conformance/**
      - packages/geospec-engine/bindings/python/tests/conftest.py
  workflow_call:
    inputs:
      run-id:
        required: true
        type: string
      macos:
        type: boolean
        default: true
      release:
        type: boolean
        default: false
      runner-routes:
        description: ci.yml's planned self-hosted replacement for each hosted runner label (JSON)
        type: string
        default: '{}'

permissions:
  contents: read

concurrency:
  group: qualify-${{ inputs.run-id || 'latest-main' }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    outputs:
      run-id: ${{ steps.source.outputs.run-id }}
      node: ${{ steps.plan.outputs.node }}
      python: ${{ steps.plan.outputs.python }}
      browser: ${{ steps.plan.outputs.browser }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - id: source
        name: Select the candidate run
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run-id }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [[ -z "$RUN_ID" && -n "$HEAD_SHA" ]]; then
            # Wait for this pull request's own candidate: its ci.yml run's `assemble` job.
            for _ in $(seq 1 150); do
              pr_run="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$HEAD_SHA&event=pull_request&per_page=1" --jq '.workflow_runs[0].id // empty')" || { sleep 60; continue; }
              if [[ -n "$pr_run" ]]; then
                assemble="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$pr_run/jobs?per_page=100" \
                  --jq '[.jobs[] | select(.name == "assemble")][0] | "\(.status) \(.conclusion)"')" || { sleep 60; continue; }
                run_state="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$pr_run" --jq '"\(.status) \(.conclusion)"')" || { sleep 60; continue; }
                if [[ "$assemble" == "completed success" ]]; then
                  RUN_ID="$pr_run"
                  break
                fi
                if [[ "$run_state" == "completed success" && "$assemble" == "completed skipped" ]]; then
                  echo "ci.yml run $pr_run built no candidate; qualifying the latest main candidate"
                  no_candidate=true
                  break
                fi
                if [[ "$run_state" == completed* || ("$assemble" == completed* && "$assemble" != "completed skipped") ]]; then
                  echo "::error::ci.yml run $pr_run ($run_state) produced no candidate (assemble: $assemble)"
                  exit 1
                fi
              fi
              sleep 60
            done
            if [[ -z "$RUN_ID" && "${no_candidate:-}" != true ]]; then
              echo "::error::timed out waiting for the ci.yml candidate of $HEAD_SHA"
              exit 1
            fi
          fi
          if [[ -z "$RUN_ID" ]]; then
            RUN_ID="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=main&event=push&status=success&per_page=1" --jq '.workflow_runs[0].id')"
          fi
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" \
            --jq '"qualifying run \(.id) (\(.event) \(.head_branch) \(.head_sha), \(.status)/\(.conclusion))"'
          echo "run-id=$RUN_ID" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-candidate
          path: candidate
          run-id: ${{ steps.source.outputs.run-id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wheels
          path: wheels
          run-id: ${{ steps.source.outputs.run-id }}
          github-token: ${{ github.token }}
      - id: plan
        env:
          RUN_ID: ${{ steps.source.outputs.run-id }}
          MACOS: ${{ inputs.macos }}
          RELEASE: ${{ inputs.release }}
        run: |
          set -euo pipefail
          flags=()
          if [[ "$MACOS" != true ]]; then flags+=(--no-macos); fi
          if [[ "$RELEASE" == true ]]; then flags+=(--release); fi
          node scripts/qualify/qualify-plan.mjs --candidate candidate --wheels wheels \
            --out out/qualify/legs/plan/ledger.json --source-run "$RUN_ID" "${flags[@]}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qualify-leg-plan
          path: out/qualify/legs/plan/
          if-no-files-found: error

  node:
    name: node (${{ matrix.suffix }}, Node ${{ matrix.node }})
    needs: plan
    if: needs.plan.outputs.node != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.node) }}
    runs-on: ${{ fromJSON(inputs.runner-routes || '{}')[matrix.runner] || matrix.runner }}
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    env:
      LEG_DIR: out/qualify/legs/${{ matrix.leg }}
    steps:
      - name: Empty the persistent runner's workspace
        if: runner.environment == 'self-hosted'
        run: chmod -R u+w "$GITHUB_WORKSPACE" && find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 -exec rm -rf {} +
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: runner.environment == 'self-hosted'
        uses: ./.github/actions/self-hosted-mac
      - uses: ./.github/actions/setup
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-candidate
          path: candidate
          run-id: ${{ needs.plan.outputs.run-id }}
          github-token: ${{ github.token }}
      - name: Install the candidate as a consumer
        env:
          SUFFIX: ${{ matrix.suffix }}
        run: |
          set -euo pipefail
          node scripts/qualify/install-candidate-consumer.mjs --candidate candidate --suffix "$SUFFIX" --out "$RUNNER_TEMP/consumer"
          mkdir -p "$LEG_DIR/evidence"
          cp "$RUNNER_TEMP/consumer/consumer.json" "$LEG_DIR/evidence/"
      - name: Run the corpora through the installed package
        id: standalone
        continue-on-error: true
        env:
          NODE_LINE: ${{ matrix.node }}
          SUFFIX: ${{ matrix.native && matrix.suffix || 'none' }}
        run: >-
          node packages/geospec-engine/bindings/browser-conformance/run-node26-conformance.ts
          --consumer "$RUNNER_TEMP/consumer" --suffix "$SUFFIX" --expect-node "$NODE_LINE"
          --suites early,material --label standalone --output "$LEG_DIR/evidence"
      - name: Run the corpora through the Vitest adapter
        id: vitest
        continue-on-error: true
        env:
          GEOSPEC_PACKED_CONSUMER: ${{ runner.temp }}/consumer
          GEOSPEC_NATIVE_SUFFIX: ${{ matrix.native && matrix.suffix || 'none' }}
          GEOSPEC_EXPECT_NODE: ${{ matrix.node }}
          GEOSPEC_CONFORMANCE_SUITES: early,material
          GEOSPEC_CONFORMANCE_LABEL: vitest
        run: |
          GEOSPEC_CONFORMANCE_OUTPUT="$PWD/$LEG_DIR/evidence/vitest" \
            node node_modules/vitest/vitest.mjs run --root packages/geospec-engine --config vitest.node26.config.ts
      # The host test imports `geospec-engine/node`, so it runs from inside the consumer.
      - name: Run the subject-lifecycle host test through the native facade
        id: lifecycle
        if: matrix.native
        continue-on-error: true
        run: |
          cp packages/geospec-engine/host-tests/lifecycle-m1/node.mjs "$RUNNER_TEMP/consumer/lifecycle.mjs"
          node "$RUNNER_TEMP/consumer/lifecycle.mjs"
      - name: Record the leg
        if: always()
        env:
          LEG: ${{ matrix.leg }}
          SUFFIX: ${{ matrix.suffix }}
          NODE_LINE: ${{ matrix.node }}
          VITEST: ${{ steps.vitest.outcome }}
          LIFECYCLE: ${{ steps.lifecycle.outcome }}
        run: >-
          node scripts/qualify/record-leg.mjs node --dir "$LEG_DIR" --leg "$LEG" --suffix "$SUFFIX"
          --node "$NODE_LINE" --vitest "$VITEST" --lifecycle "$LIFECYCLE"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: qualify-leg-${{ matrix.leg }}
          path: ${{ env.LEG_DIR }}/
          if-no-files-found: error
      - name: Empty the persistent runner's workspace
        if: always() && runner.environment == 'self-hosted'
        # Keeps .github: the post steps of local actions read their action.yml.
        # chmod first: the OCCT source verification leaves read-only trees.
        run: chmod -R u+w "$GITHUB_WORKSPACE" && find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 ! -name .github -exec rm -rf {} +

  python:
    name: python (${{ matrix.suffix }}, CPython ${{ matrix.python }})
    needs: plan
    if: needs.plan.outputs.python != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.python) }}
    runs-on: ${{ fromJSON(inputs.runner-routes || '{}')[matrix.runner] || matrix.runner }}
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    env:
      LEG_DIR: out/qualify/legs/${{ matrix.leg }}
    steps:
      - name: Empty the persistent runner's workspace
        if: runner.environment == 'self-hosted'
        run: chmod -R u+w "$GITHUB_WORKSPACE" && find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 -exec rm -rf {} +
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: mac
        if: runner.environment == 'self-hosted'
        uses: ./.github/actions/self-hosted-mac
        with:
          python: ${{ matrix.python }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - id: python
        if: runner.environment != 'self-hosted'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wheels
          path: wheels
          run-id: ${{ needs.plan.outputs.run-id }}
          github-token: ${{ github.token }}
      - name: Test the installed wheel
        continue-on-error: true
        env:
          WHEEL: wheels/${{ matrix.wheel }}
          PYTHON: ${{ steps.python.outputs.python-path || steps.mac.outputs.python-path }}
        run: scripts/qualify/run-wheel-qualification.sh --wheel "$WHEEL" --python "$PYTHON" --out "$LEG_DIR"
      - name: Record the leg
        if: always()
        env:
          LEG: ${{ matrix.leg }}
          SUFFIX: ${{ matrix.suffix }}
          PYTHON_LINE: ${{ matrix.python }}
        run: node scripts/qualify/record-leg.mjs python --dir "$LEG_DIR" --leg "$LEG" --suffix "$SUFFIX" --python "$PYTHON_LINE"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: qualify-leg-${{ matrix.leg }}
          path: ${{ env.LEG_DIR }}/
          if-no-files-found: error
      - name: Empty the persistent runner's workspace
        if: always() && runner.environment == 'self-hosted'
        # Keeps .github: the post steps of local actions read their action.yml.
        # chmod first: the OCCT source verification leaves read-only trees.
        run: chmod -R u+w "$GITHUB_WORKSPACE" && find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 ! -name .github -exec rm -rf {} +

  browser:
    name: browser (${{ matrix.suffix }}, ${{ matrix.browser }})
    needs: plan
    if: needs.plan.outputs.browser != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.browser) }}
    runs-on: ${{ fromJSON(inputs.runner-routes || '{}')[matrix.runner] || matrix.runner }}
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    env:
      LEG_DIR: out/qualify/legs/${{ matrix.leg }}
    steps:
      - name: Empty the persistent runner's workspace
        if: runner.environment == 'self-hosted'
        run: chmod -R u+w "$GITHUB_WORKSPACE" && find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 -exec rm -rf {} +
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: runner.environment == 'self-hosted'
        uses: ./.github/actions/self-hosted-mac
      - uses: ./.github/actions/setup
        with:
          node-version: '24'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-candidate
          path: candidate
          run-id: ${{ needs.plan.outputs.run-id }}
          github-token: ${{ github.token }}
      - name: Install the candidate as a WASM-only consumer
        run: |
          set -euo pipefail
          node scripts/qualify/install-candidate-consumer.mjs --candidate candidate --wasm-only --out "$RUNNER_TEMP/consumer"
          mkdir -p "$LEG_DIR/evidence"
          cp "$RUNNER_TEMP/consumer/consumer.json" "$LEG_DIR/evidence/"
      - name: Use the official Ubuntu archive mirrors
        if: runner.os == 'Linux' && runner.environment == 'github-hosted'
        # The Azure mirror can remain responsive while downloading too slowly for qualification.
        # Keep the hosted image's HTTPS fallbacks and all repository signature settings.
        run: |
          set -euo pipefail
          mirrors=/etc/apt/apt-mirrors.txt
          azure=$'http://azure.archive.ubuntu.com/ubuntu/\tpriority:1'
          official=$'https://archive.ubuntu.com/ubuntu/\tpriority:2\nhttps://security.ubuntu.com/ubuntu/\tpriority:3'
          current=$(cat "$mirrors")
          if [[ "$current" != "$azure"$'\n'"$official" && "$current" != "$official" ]]; then
            echo 'Unexpected hosted Ubuntu mirror configuration' >&2
            exit 1
          fi
          printf '%s\n' "$official" | sudo tee "$mirrors"
      - name: Install the pinned browser
        env:
          BROWSER: ${{ matrix.browser }}
        run: |
          if [[ "$RUNNER_OS" == Linux ]]; then
            pnpm exec playwright install --with-deps "$BROWSER"
          else
            pnpm exec playwright install "$BROWSER"
          fi
      - name: Run the early and material corpora in the browser
        continue-on-error: true
        env:
          BROWSER: ${{ matrix.browser }}
        run: |
          set -uo pipefail
          status=0
          for suite in early material; do
            node packages/geospec-engine/bindings/browser-conformance/run-browser-conformance.ts \
              --consumer "$RUNNER_TEMP/consumer" --browsers "$BROWSER" --suite "$suite" \
              --label "browser-$suite" --output "$LEG_DIR/evidence" || status=1
          done
          exit "$status"
      - name: Record the leg
        if: always()
        env:
          LEG: ${{ matrix.leg }}
          SUFFIX: ${{ matrix.suffix }}
          BROWSER: ${{ matrix.browser }}
        run: node scripts/qualify/record-leg.mjs browser --dir "$LEG_DIR" --leg "$LEG" --suffix "$SUFFIX" --browser "$BROWSER"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: qualify-leg-${{ matrix.leg }}
          path: ${{ env.LEG_DIR }}/
          if-no-files-found: error
      - name: Empty the persistent runner's workspace
        if: always() && runner.environment == 'self-hosted'
        # Keeps .github: the post steps of local actions read their action.yml.
        # chmod first: the OCCT source verification leaves read-only trees.
        run: chmod -R u+w "$GITHUB_WORKSPACE" && find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 ! -name .github -exec rm -rf {} +

  gate:
    if: always()
    needs: [plan, node, python, browser]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: qualify-leg-*
          path: out/qualify/downloaded
      - name: Lay out one directory per leg
        run: |
          set -euo pipefail
          mkdir -p out/qualify/legs
          for directory in out/qualify/downloaded/qualify-leg-*; do
            [[ -d "$directory" ]] || continue
            mv "$directory" "out/qualify/legs/$(basename "$directory" | sed 's/^qualify-leg-//')"
          done
      - name: Compare JS and Python canonical results
        run: node scripts/qualify/canonical-equality.mjs --legs out/qualify/legs --out out/qualify/legs/equality/ledger.json
      - name: Decide
        run: node scripts/qualify/qualification-gate.mjs --legs out/qualify/legs --out out/qualify/summary.json --require-leg plan
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: qualify-summary
          path: out/qualify/
          if-no-files-found: error
