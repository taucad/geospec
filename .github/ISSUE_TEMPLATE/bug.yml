name: Bug report
description: Report reproducible incorrect behavior.
title: '[bug]: '
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: 'geospec-engine@x.y.z'
    validations:
      required: true
  - type: dropdown
    id: host
    attributes:
      label: Host
      options: [Node, Python, Chromium, Firefox, WebKit, Native Linux, Native macOS]
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include exact input, code, and observed output.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
