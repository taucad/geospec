[package]
name = "geospec-facts-occt"
description = "The facts layer's OCCT adapter: OCCT B-rep faces as kernel-agnostic face definitions"
version = "0.0.0"
edition = "2021"
rust-version = "1.88"
license = "Apache-2.0"
publish = false
build = "build.rs"

# Its own workspace: the adapter compiles the bridge's source with its export
# (`export/`) into a binary of its own and never reaches a product path. The
# facts crate it feeds (`../core`) has no OCCT dependency.
[workspace]

[dependencies]
geospec-facts = { path = "../core" }
serde_json = { version = "=1.0.143", features = ["float_roundtrip"] }

# The OCCT prefix's Standard::Allocate goes to mimalloc on native targets
# (native/occt/standard-mimalloc-allocator.patch), as in the OCCT crate.
[target.'cfg(not(target_os = "emscripten"))'.dependencies]
libmimalloc-sys = { version = "=0.1.49", default-features = false, features = ["v2", "local_dynamic_tls"] }

[build-dependencies]
cc = "=1.6.0"

[lints.rust]
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
disallowed_methods = "deny"

[profile.release]
debug = "line-tables-only"
