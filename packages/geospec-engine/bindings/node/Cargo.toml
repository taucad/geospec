[package]
name = "geospec-engine-native-node"
version = "0.0.0"
edition = "2021"
rust-version = "1.88"
license = "Apache-2.0"
publish = false

[lib]
path = "src/lib.rs"
crate-type = ["cdylib"]

[features]
# Test-only S10 fault injection, forwarded to the runtime; never in a release build.
s10-fault-injection = ["geospec-engine-native-runtime/s10-fault-injection"]

[dependencies]
geospec-engine-native-cache-host = { path = "../../native/cache-host" }
geospec-engine-native-runtime = { path = "../../native/runtime", default-features = false, features = ["binding-node"] }
geospec-engine-native-core = { path = "../../rust" }
napi = { version = "=3.12.2", default-features = false, features = ["napi8"] }
napi-derive = "=3.6.9"

[build-dependencies]
napi-build = "=2.6.0"
